name: Build Chatter Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure CircuitMess package index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/CircuitMess/Arduino-Packages/master/package_circuitmess.com_esp32_index.json
          arduino-cli core update-index

      - name: Install Chatter platform
        run: arduino-cli core install cm:esp32@1.7.5

      - name: Compile firmware
        run: |
          mkdir -p build
          arduino-cli compile --fqbn cm:esp32:chatter --output-dir build Chatter-Firmware.ino

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatter-firmware-build
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: error
